<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">基元素交中的小基元素</title><desc id="desc">两个透视椭圆形邻域相交，交中点 x 附近还有一个更小的邻域。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><ellipse cx="210" cy="196" rx="98" ry="40" fill="#fff" stroke="#171717" stroke-width="1.8"/><ellipse cx="289" cy="203" rx="98" ry="40" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.8"/><ellipse cx="248" cy="199" rx="31" ry="14" fill="#fff" stroke="#171717" stroke-width="2" stroke-dasharray="4 2"/><circle cx="248" cy="199" r="3" /><text x="144" y="144" >B1</text><text x="344" y="163" >B2</text><text x="234" y="147" >B3</text><line x1="247" y1="153" x2="248" y2="183" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /><text x="252" y="215" >x</text></g>
</svg>