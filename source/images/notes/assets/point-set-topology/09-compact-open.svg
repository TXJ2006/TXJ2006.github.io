<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">紧开拓扑控制整个紧集的像</title><desc id="desc">下层空间 X 的紧区间 K 经过映射后，所有像点都落在上层空间 Y 的开区域 U 内。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M56 256L376 256L430 202L110 202Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M93 135L398 135L441 92L136 92Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M146 215H313" fill="none" stroke="#171717" stroke-width="5"/><ellipse cx="264" cy="99" rx="91" ry="25" fill="url(#wideHatch)" stroke="#171717" stroke-width="1.5"/><path d="M156 210C171 170 196 127 218 99 M304 210C296 165 318 131 332 103" fill="none" stroke="#171717" stroke-width="1.3" marker-end="url(#arrow)"/><circle cx="218" cy="99" r="3" /><circle cx="332" cy="103" r="3" /><text x="218" y="236" >K</text><text x="359" y="104" >U</text><text x="74" y="278" >X</text><text x="112" y="155" >Y</text></g>
</svg>