<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">Baire 定理中的嵌套闭球</title><desc id="desc">三维透视平面上越来越小的闭球嵌套，每层与一个稠密开集相容，最终保留公共极限点。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><ellipse cx="247" cy="202" rx="128" ry="45" fill="#fff" stroke="#171717" stroke-width="1.7"/><ellipse cx="258" cy="202" rx="85" ry="30" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5"/><ellipse cx="264" cy="202" rx="44" ry="15" fill="#fff" stroke="#171717" stroke-width="1.5"/><circle cx="267" cy="202" r="4" /><text x="115" y="143" >K₁</text><text x="178" y="161" >K₂</text><text x="227" y="180" >K₃</text><text x="272" y="213" >x</text><text x="150" y="273" >diameters tend to zero</text></g>
</svg>