<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">开集中的局部开球</title><desc id="desc">透视平面上的开区域包含点 x，x 周围的小圆盘完全位于区域内；边界点没有这样的圆盘。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M112 203C156 157 249 155 329 184C376 202 377 230 312 235L168 235C117 234 94 218 112 203Z" fill="#fff" stroke="#171717" stroke-width="2"/><ellipse cx="226" cy="202" rx="39" ry="16" fill="url(#wideHatch)" stroke="#171717" stroke-width="1.6"/><circle cx="226" cy="202" r="3" /><circle cx="342" cy="225" r="3" fill="#fff" stroke="#171717" stroke-width="1.5"/><text x="237" y="196" >x</text><text x="350" y="222" >b</text><text x="150" y="132" >U open</text><line x1="166" y1="137" x2="187" y2="177" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /><text x="42" y="269" >X</text></g>
</svg>