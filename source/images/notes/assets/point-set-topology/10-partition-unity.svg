<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">局部有限的单位分解</title><desc id="desc">透视底面上的两个重叠开片各有一座函数小丘，两座小丘在重叠处互补，点处函数值之和为一。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M46 260L390 260L450 200L106 200Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M118 219H393" fill="none" stroke="#171717" stroke-width="1.5"/><path d="M118 113H178L324 219H393" fill="none" stroke="#171717" stroke-width="2"/><path d="M118 219H178L324 113H393" fill="none" stroke="#171717" stroke-width="2" stroke-dasharray="7 3"/><line x1="178" y1="219" x2="178" y2="113" stroke="#777" stroke-dasharray="4 3"/><line x1="324" y1="219" x2="324" y2="113" stroke="#777" stroke-dasharray="4 3"/><text x="132" y="103" >φ₁=1</text><text x="344" y="103" >φ₂=1</text><text x="196" y="159" >φ₁+φ₂=1</text><text x="204" y="278" >overlap region</text></g>
</svg>