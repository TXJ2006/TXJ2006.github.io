<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">紧空间的有限子覆盖</title><desc id="desc">球面被多块开片覆盖，其中三块用较深剖面线强调，表示从原开覆盖中选择有限多个即可覆盖整体。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><defs><clipPath id="sphere"><ellipse cx="245" cy="190" rx="123" ry="91"/></clipPath></defs><ellipse cx="245" cy="190" rx="123" ry="91" fill="#fff" stroke="#171717" stroke-width="1.8"/><g clip-path="url(#sphere)"><ellipse cx="178" cy="188" rx="91" ry="100" fill="url(#fineHatch)" stroke="#171717" stroke-width="1"/><ellipse cx="247" cy="181" rx="92" ry="102" fill="url(#fineHatch)" stroke="#171717" stroke-width="1"/><ellipse cx="328" cy="195" rx="88" ry="102" fill="url(#fineHatch)" stroke="#171717" stroke-width="1"/></g><ellipse cx="245" cy="190" rx="123" ry="91" fill="none" stroke="#171717" stroke-width="1.8"/><text x="147" y="86" >U₁</text><text x="243" y="77" >U₂</text><text x="343" y="101" >U₃</text><text x="185" y="288" >three selected open patches</text></g>
</svg>