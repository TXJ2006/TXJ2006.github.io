<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">评价映射读出函数在一点的值</title><desc id="desc">三维透视曲面表示函数图像，底面上选一点 x，垂直虚线升到图像值 f(x)。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M62 252L392 252L447 197L117 197Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M107 190C180 176 225 140 295 135S374 155 412 120L425 172C360 202 274 190 210 233L107 243Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5"/><path d="M107 190C180 176 225 140 295 135S374 155 412 120" fill="none" stroke="#171717" stroke-width="2"/><circle cx="244" cy="225" r="4" /><line x1="244" y1="225" x2="244" y2="153" stroke="#171717" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="244" cy="153" r="4" /><text x="234" y="254" >x</text><text x="249" y="151" >f(x)</text><text x="153" y="111" >graph of f</text></g>
</svg>