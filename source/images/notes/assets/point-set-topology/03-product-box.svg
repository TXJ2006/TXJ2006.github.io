<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">积拓扑的小长方体</title><desc id="desc">两个坐标方向的开区间相乘，得到积空间中的开矩形；第三方向表示另一坐标限制。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M118 112L180 70L370 70L308 112Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5"/><path d="M308 112L370 70L370 190L308 232Z" fill="#eee" stroke="#171717" stroke-width="1.5"/><path d="M118 112H308V232H118Z" fill="#fff" stroke="#171717" stroke-width="1.5"/><path d="M118 232L180 190L370 190" fill="none" stroke="#555" stroke-dasharray="5 4"/><path d="M158 128L348 128L370 112 M158 128L158 209 M348 128L348 209" fill="none" stroke="#555" stroke-dasharray="5 4"/><text x="108" y="265" >U in X</text><text x="322" y="260" >V in Y</text><line x1="163" y1="254" x2="193" y2="217" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /><line x1="373" y1="251" x2="329" y2="221" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /><text x="209" y="99" >U × V</text></g>
</svg>