<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">局部有限覆盖的邻域判据</title><desc id="desc">透视平面上的开片沿一条方向排列，固定点 x 附近的小邻域只与两块开片相交，远处其他开片不参与局部计算。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><ellipse cx="139" cy="204" rx="57" ry="21" fill="none" stroke="#171717" stroke-width="1.4"/><ellipse cx="205" cy="209" rx="57" ry="21" fill="none" stroke="#171717" stroke-width="1.4"/><ellipse cx="271" cy="204" rx="57" ry="21" fill="none" stroke="#171717" stroke-width="1.4"/><ellipse cx="337" cy="209" rx="57" ry="21" fill="none" stroke="#171717" stroke-width="1.4"/><circle cx="237" cy="206" r="4" /><ellipse cx="237" cy="206" rx="34" ry="14" fill="url(#wideHatch)" stroke="#171717" stroke-dasharray="4 3"/><text x="225" y="174" >x</text><text x="153" y="276" >only nearby patches meet x</text></g>
</svg>