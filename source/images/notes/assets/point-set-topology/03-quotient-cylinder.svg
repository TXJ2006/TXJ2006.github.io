<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M28 235L198 235L243 190L73 190Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M72 190L28 235 M242 190L198 235" fill="none" stroke="#171717" stroke-width="4"/><text x="46" y="173" >0</text><text x="232" y="174" >1</text><line x1="249" y1="188" x2="286" y2="188" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /><ellipse cx="372" cy="147" rx="64" ry="24" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.7"/><path d="M308 147V233 M436 147V233" fill="none" stroke="#171717" stroke-width="1.7"/><path d="M308 233C308 246 336 257 372 257S436 246 436 233" fill="none" stroke="#171717" stroke-width="1.7"/><path d="M308 233C308 220 336 209 372 209S436 220 436 233" fill="none" stroke="#777" stroke-dasharray="5 4"/><text x="337" y="286" >S¹ × I</text></g>
