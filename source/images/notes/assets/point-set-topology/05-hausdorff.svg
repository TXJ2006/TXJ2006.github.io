<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">Hausdorff 空间可分开不同点</title><desc id="desc">透视平面上两个点各有一个开邻域，邻域之间留有明确间隙；虚线连接表示两点本身并不需要有距离函数。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><ellipse cx="171" cy="205" rx="59" ry="25" fill="#fff" stroke="#171717" stroke-width="1.7"/><ellipse cx="334" cy="205" rx="59" ry="25" fill="#fff" stroke="#171717" stroke-width="1.7"/><circle cx="171" cy="205" r="4" /><circle cx="334" cy="205" r="4" /><path d="M230 205H275" fill="none" stroke="#777" stroke-dasharray="4 4"/><text x="165" y="168" >U</text><text x="329" y="168" >V</text><text x="164" y="234" >x</text><text x="327" y="234" >y</text><text x="195" y="275" >U ∩ V = ∅</text></g>
</svg>