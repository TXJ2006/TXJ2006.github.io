<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">全有界抽子列、完备性给极限</title><desc id="desc">三层透视区域的半径逐层缩小；序列子列始终留在越来越小的区域里，最后收敛于同一极限点。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M62 255L382 255L435 202L115 202Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><ellipse cx="230" cy="215" rx="95" ry="32" fill="#fff" stroke="#171717"/><ellipse cx="245" cy="209" rx="57" ry="19" fill="url(#fineHatch)" stroke="#171717"/><ellipse cx="255" cy="205" rx="26" ry="9" fill="#fff" stroke="#171717"/><circle cx="175" cy="220" r="3" /><circle cx="211" cy="215" r="3" /><circle cx="237" cy="209" r="3" /><circle cx="252" cy="205" r="3" /><circle cx="261" cy="204" r="5" fill="#fff" stroke="#171717" stroke-width="1.5"/><text x="130" y="150" >ε₁</text><text x="189" y="164" >ε₂</text><text x="230" y="179" >ε₃</text><text x="297" y="181" >limit</text><line x1="304" y1="184" x2="270" y2="201" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /><text x="103" y="281" >finite covers select a Cauchy subsequence</text></g>
</svg>