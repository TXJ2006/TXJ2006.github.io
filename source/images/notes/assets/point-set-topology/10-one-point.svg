<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">一点紧化的立体投影视角</title><desc id="desc">左侧透视平面上的远处方向通过曲线箭头汇到右侧球面的北极点 infinity，表示一点紧化。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M9 246L205 246L243 208L47 208Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M83 229C115 214 157 206 193 199" fill="none" stroke="#171717" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/><line x1="232" y1="179" x2="281" y2="160" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /><ellipse cx="369" cy="178" rx="76" ry="76" fill="#fff" stroke="#171717" stroke-width="1.8"/><path d="M293 178C293 197 327 210 369 210S445 197 445 178" fill="none" stroke="#777" stroke-dasharray="4 3"/><path d="M293 178C293 159 327 146 369 146S445 159 445 178" fill="none" stroke="#171717" stroke-width="1.1"/><circle cx="369" cy="102" r="5" /><text x="379" y="104" >∞</text><text x="42" y="277" >R²</text><text x="345" y="274" >S²</text></g>
</svg>