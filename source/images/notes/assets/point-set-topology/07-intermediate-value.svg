<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">连续曲线穿过中间高度</title><desc id="desc">透视坐标平面上连续曲线从低处走向高处，中间高度的虚线与曲线相交，对应中间值定理。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M60 257L400 257L455 202L115 202Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><line x1="107" y1="228" x2="107" y2="69" stroke="#171717" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="107" y1="228" x2="425" y2="228" stroke="#171717" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M114 215C174 215 173 142 224 170S293 115 350 88S393 100 414 75" fill="none" stroke="#171717" stroke-width="2.5"/><line x1="109" y1="150" x2="406" y2="150" stroke="#777" stroke-dasharray="5 4"/><circle cx="264" cy="150" r="4" /><text x="75" y="155" >t</text><text x="257" y="140" >f(c)=t</text><text x="401" y="246" >x</text></g>
</svg>