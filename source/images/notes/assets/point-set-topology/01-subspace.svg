<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">子空间的相对开集</title><desc id="desc">大平面 X 中的带状子空间 Y 被开区域 U 截出一段在 Y 中开放、在 X 中未必开放的部分。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M75 223L398 223L411 206L88 206Z" fill="#fff" stroke="#171717" stroke-width="1.5"/><ellipse cx="226" cy="206" rx="76" ry="36" fill="none" stroke="#171717" stroke-width="1.6" stroke-dasharray="5 3"/><path d="M150 214L301 214L294 223L143 223Z" fill="url(#wideHatch)" stroke="#171717" stroke-width="1"/><text x="35" y="266" >X</text><text x="418" y="219" >Y</text><text x="211" y="161" >U</text><text x="207" y="281" >U ∩ Y</text><line x1="240" y1="265" x2="237" y2="224" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /></g>
</svg>