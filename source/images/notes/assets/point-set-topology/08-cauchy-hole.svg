<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">Cauchy 序列趋向缺失的点</title><desc id="desc">透视平面上序列点沿一条轨迹靠近一个空心缺失点，点彼此越来越近却无空间内极限。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M120 226C172 208 214 203 282 199" fill="none" stroke="#171717" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="130" cy="225" r="4" /><circle cx="170" cy="210.2778072626797" r="3.75" /><circle cx="202" cy="205.04741294986638" r="3.5" /><circle cx="225" cy="203.02758330980825" r="3.25" /><circle cx="242" cy="202.0750534989552" r="3" /><circle cx="254" cy="201.58934227847251" r="2.75" /><circle cx="263" cy="201.30124340055247" r="2.5" /><circle cx="270" cy="201.11378565611224" r="2.25" /><circle cx="282" cy="199" r="7" fill="#fff" stroke="#171717" stroke-width="1.8"/><text x="105" y="163" >x₁, x₂, ...</text><text x="283" y="173" >missing limit</text><line x1="306" y1="177" x2="286" y2="190" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /><text x="150" y="276" >terms approach each other</text></g>
</svg>