<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">连续函数把空间嵌入可数积</title><desc id="desc">左侧原空间的点通过三条坐标函数箭头映入右侧透视立方体；函数值同时区分点和邻域。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M20 246L165 246L208 203L63 203Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><ellipse cx="112" cy="217" rx="47" ry="17" fill="#fff" stroke="#171717" stroke-width="1.5"/><circle cx="111" cy="217" r="4" /><path d="M275 107L314 74L430 74L391 107Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5"/><path d="M391 107L430 74L430 179L391 212Z" fill="#eee" stroke="#171717" stroke-width="1.5"/><path d="M275 107H391V212H275Z" fill="#fff" stroke="#171717" stroke-width="1.5"/><path d="M275 212L314 179L430 179" fill="none" stroke="#555" stroke-dasharray="5 4"/><circle cx="342" cy="165" r="5" /><path d="M163 208C216 194 226 181 316 166" fill="none" stroke="#171717" stroke-width="1.7" marker-end="url(#arrow)"/><text x="44" y="275" >X</text><text x="210" y="176" >F=(f₁,f₂,...)</text><text x="282" y="242" >[0,1]ᴺ</text></g>
