<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">内部与闭包的三层边界</title><desc id="desc">透视平面上白色区域 A、内部点和贴着边界的闭包点；边界外的点可用邻域分开。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><ellipse cx="248" cy="208" rx="110" ry="38" fill="#fff" stroke="#171717" stroke-width="2"/><ellipse cx="238" cy="204" rx="31" ry="13" fill="url(#wideHatch)" stroke="#171717" stroke-width="1.4"/><circle cx="238" cy="204" r="3" /><circle cx="354" cy="210" r="4" fill="#fff" stroke="#171717" stroke-width="1.6"/><circle cx="401" cy="206" r="4" /><text x="212" y="151" >interior</text><line x1="239" y1="157" x2="240" y2="188" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /><text x="319" y="139" >boundary</text><line x1="353" y1="146" x2="354" y2="197" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /><text x="380" y="274" >outside</text><line x1="403" y1="260" x2="402" y2="215" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /><text x="251" y="236" >A</text></g>
</svg>