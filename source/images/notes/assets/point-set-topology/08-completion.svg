<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">完备化补上缺失极限</title><desc id="desc">下层透视数轴有一个空心缺口，上层完成后的数轴把该点填实；箭头表示稠密的等距嵌入。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M45 249L392 249L437 204L90 204Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><line x1="118" y1="213" x2="397" y2="213" stroke="#171717" stroke-width="2"/><circle cx="270" cy="213" r="6" fill="#fff" stroke="#171717" stroke-width="2"/><text x="115" y="282" >X: Cauchy gap</text><line x1="276" y1="193" x2="276" y2="132" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /><path d="M81 130L399 130L436 93L118 93Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><line x1="137" y1="111" x2="389" y2="111" stroke="#171717" stroke-width="2"/><circle cx="276" cy="111" r="6" /><text x="113" y="79" >completion X̂</text><text x="312" y="86" >new point</text><line x1="321" y1="93" x2="283" y2="107" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /></g>
</svg>