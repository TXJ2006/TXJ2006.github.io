<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">序列看不见的闭包点</title><desc id="desc">透视平面上点 x 被许多点围绕；一个只列出可数点的序列可被包含 x 的开集整体避开。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><circle cx="250" cy="202" r="5" fill="#fff" stroke="#171717" stroke-width="1.8"/><line x1="143" y1="193" x2="153" y2="203" stroke="#171717" stroke-width="1.4"/><line x1="143" y1="203" x2="153" y2="193" stroke="#171717" stroke-width="1.4"/><line x1="176" y1="209" x2="186" y2="219" stroke="#171717" stroke-width="1.4"/><line x1="176" y1="219" x2="186" y2="209" stroke="#171717" stroke-width="1.4"/><line x1="213" y1="187" x2="223" y2="197" stroke="#171717" stroke-width="1.4"/><line x1="213" y1="197" x2="223" y2="187" stroke="#171717" stroke-width="1.4"/><line x1="289" y1="221" x2="299" y2="231" stroke="#171717" stroke-width="1.4"/><line x1="289" y1="231" x2="299" y2="221" stroke="#171717" stroke-width="1.4"/><line x1="326" y1="181" x2="336" y2="191" stroke="#171717" stroke-width="1.4"/><line x1="326" y1="191" x2="336" y2="181" stroke="#171717" stroke-width="1.4"/><line x1="360" y1="207" x2="370" y2="217" stroke="#171717" stroke-width="1.4"/><line x1="360" y1="217" x2="370" y2="207" stroke="#171717" stroke-width="1.4"/><text x="249" y="183" >x</text><text x="151" y="151" >A = X without x</text><text x="112" y="279" >U = X without all sequence values</text></g>
