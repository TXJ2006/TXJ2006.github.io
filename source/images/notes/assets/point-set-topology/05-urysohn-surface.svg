<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">连续函数分开闭集</title><desc id="desc">透视平面上两个闭集 A、B 位于不同高度，连续曲面从函数值零平滑升到一，表示 Urysohn 函数。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M45 257L395 257L454 198L104 198Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M91 196C158 196 186 190 220 150S300 90 368 90L418 142C350 141 315 171 269 205S151 249 91 249Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.7"/><path d="M91 196C158 196 186 190 220 150S300 90 368 90" fill="none" stroke="#171717" stroke-width="2"/><path d="M115 195C171 194 198 184 232 147S301 91 368 91 M133 210C184 206 215 184 245 151S322 108 390 111" fill="none" stroke="#777" stroke-width="1"/><ellipse cx="119" cy="231" rx="27" ry="9" fill="none" stroke="#171717"/><ellipse cx="381" cy="175" rx="27" ry="9" fill="none" stroke="#171717"/><line x1="381" y1="175" x2="381" y2="92" stroke="#555" stroke-dasharray="5 3"/><text x="110" y="280" >A: h=0</text><text x="364" y="198" >B</text><text x="389" y="91" >h=1</text></g>
</svg>