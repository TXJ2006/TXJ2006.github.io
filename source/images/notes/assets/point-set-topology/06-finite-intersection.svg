<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">闭集有限交性质</title><desc id="desc">透视平面上逐层嵌套的三个闭区域保留一个共同点；交中点体现有限条件相容时紧性的全局结论。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><ellipse cx="245" cy="204" rx="127" ry="47" fill="#fff" stroke="#171717" stroke-width="1.7"/><ellipse cx="248" cy="203" rx="91" ry="34" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5"/><ellipse cx="251" cy="202" rx="52" ry="20" fill="#fff" stroke="#171717" stroke-width="1.5"/><circle cx="251" cy="203" r="4" /><text x="113" y="149" >F₁</text><text x="158" y="157" >F₂</text><text x="206" y="173" >F₃</text><text x="259" y="209" >x</text><text x="135" y="276" >the common intersection</text></g>
</svg>