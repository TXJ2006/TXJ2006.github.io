<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">无限积的有限坐标限制</title><desc id="desc">一列透视坐标平面中只有前三层被剖面线标出，其余坐标不受限制；方框拓扑会同时限制所有层。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M90 252L320 252L362 210L132 210Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M116 221L346 221L388 179L158 179Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M142 190L372 190L414 148L184 148Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M168 159L398 159L440 117L210 117Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M194 128L424 128L466 86L236 86Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" stroke-dasharray="5 4"/><ellipse cx="240" cy="227" rx="31" ry="10" fill="url(#wideHatch)" stroke="#171717"/><ellipse cx="266" cy="196" rx="31" ry="10" fill="url(#wideHatch)" stroke="#171717"/><ellipse cx="292" cy="165" rx="31" ry="10" fill="url(#wideHatch)" stroke="#171717"/><text x="55" y="269" >x₁</text><text x="90" y="235" >x₂</text><text x="118" y="204" >x₃</text><text x="343" y="105" >...</text><text x="115" y="291" >only finitely many coordinates</text></g>
</svg>