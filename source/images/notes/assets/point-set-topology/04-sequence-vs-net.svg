<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">序列与网的索引形状</title><desc id="desc">左侧线性序列沿单方向逼近极限；右侧分支有向集通过共同上界汇合到同一点。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M22 252L207 252L253 206L68 206Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M264 252L414 252L460 206L310 206Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M65 218L178 218" fill="none" stroke="#171717" marker-end="url(#arrow)"/><circle cx="76" cy="218" r="3" /><circle cx="104" cy="218" r="3" /><circle cx="130" cy="218" r="3" /><circle cx="151" cy="218" r="3" /><circle cx="169" cy="218" r="3" /><circle cx="184" cy="218" r="5" fill="#fff" stroke="#171717"/><text x="70" y="172" >sequence</text><text x="300" y="172" >directed net</text><path d="M303 236L339 208L385 222L414 190 M303 198L339 208 M385 222L414 190" fill="none" stroke="#171717" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="303" cy="236" r="3" /><circle cx="339" cy="208" r="3" /><circle cx="385" cy="222" r="3" /><circle cx="414" cy="190" r="3" /></g>
</svg>