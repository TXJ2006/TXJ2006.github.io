<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">全有界的有限小球覆盖</title><desc id="desc">透视平面上的一块区域由有限个同半径的小球覆盖；每个半径都须能重新找到这样的有限覆盖。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><path d="M123 205H353" fill="none" stroke="#171717" stroke-width="3"/><ellipse cx="145" cy="204" rx="54" ry="22" fill="none" stroke="#171717" stroke-width="1.4"/><ellipse cx="207" cy="209" rx="54" ry="22" fill="none" stroke="#171717" stroke-width="1.4"/><ellipse cx="269" cy="204" rx="54" ry="22" fill="none" stroke="#171717" stroke-width="1.4"/><ellipse cx="331" cy="209" rx="54" ry="22" fill="none" stroke="#171717" stroke-width="1.4"/><circle cx="145" cy="204" r="3" /><circle cx="207" cy="209" r="3" /><circle cx="269" cy="204" r="3" /><circle cx="331" cy="209" r="3" /><text x="126" y="146" >ε-balls</text><text x="102" y="246" >X</text><text x="137" y="280" >finite cover at each scale</text></g>
</svg>