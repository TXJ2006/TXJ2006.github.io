<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">两个开闭分支</title><desc id="desc">透视平面上两个相隔的实心区域各自可由开邻域包围；它们组成不连通空间的两个开闭部分。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><ellipse cx="170" cy="201" rx="67" ry="26" fill="url(#wideHatch)" stroke="#171717" stroke-width="1.7"/><ellipse cx="336" cy="204" rx="67" ry="26" fill="url(#wideHatch)" stroke="#171717" stroke-width="1.7"/><text x="159" y="207" >U</text><text x="330" y="210" >V</text><text x="182" y="275" >U ∩ V = ∅</text></g>
</svg>