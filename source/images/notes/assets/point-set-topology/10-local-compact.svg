<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">非紧空间中的紧邻域</title><desc id="desc">无界透视平面 X 中只有点 x 周围一块闭盘被圈出；整体无界而局部闭包紧。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M15 266L390 266L458 198L83 198Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><ellipse cx="242" cy="212" rx="68" ry="23" fill="#fff" stroke="#171717" stroke-width="1.6"/><ellipse cx="242" cy="212" rx="45" ry="15" fill="url(#wideHatch)" stroke="#171717" stroke-width="1.4"/><circle cx="242" cy="212" r="4" /><text x="246" y="203" >x</text><text x="160" y="166" >compact closure</text><line x1="213" y1="171" x2="225" y2="189" stroke="#171717" stroke-width="1.6" marker-end="url(#arrow)" /><text x="18" y="291" >noncompact X extends beyond this view</text></g>
</svg>