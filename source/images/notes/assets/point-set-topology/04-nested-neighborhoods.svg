<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">可数邻域基逐层缩小</title><desc id="desc">透视平面上的三个嵌套椭圆邻域 U1、U2、U3 包围同一个点 x，序列点逐层逼近 x。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><ellipse cx="244" cy="203" rx="132" ry="42" fill="#fff" stroke="#171717" stroke-width="1.5"/><ellipse cx="244" cy="203" rx="89" ry="28" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5"/><ellipse cx="244" cy="203" rx="42" ry="14" fill="#fff" stroke="#171717" stroke-width="1.5"/><circle cx="244" cy="203" r="3" /><circle cx="145" cy="206" r="3" /><circle cx="184" cy="201" r="3" /><circle cx="223" cy="202" r="3" /><text x="112" y="147" >U₁</text><text x="156" y="158" >U₂</text><text x="217" y="176" >U₃</text><text x="251" y="212" >x</text><text x="123" y="226" >a₁</text><text x="176" y="227" >a₂</text><text x="215" y="225" >a₃</text></g>
</svg>