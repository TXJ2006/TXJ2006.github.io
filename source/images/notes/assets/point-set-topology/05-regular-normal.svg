<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">点与闭集的分离</title><desc id="desc">左侧孤立点 x 有圆形开邻域，右侧闭集 F 有带状开邻域，两个邻域在透视平面上不相交。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 245L380 245L445 180L115 180Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5" /><ellipse cx="165" cy="209" rx="53" ry="22" fill="#fff" stroke="#171717" stroke-width="1.7"/><ellipse cx="333" cy="205" rx="80" ry="31" fill="#fff" stroke="#171717" stroke-width="1.7"/><ellipse cx="333" cy="205" rx="49" ry="15" fill="url(#wideHatch)" stroke="#171717" stroke-width="1"/><circle cx="165" cy="209" r="4" /><text x="155" y="171" >x</text><text x="329" y="211" >F</text><text x="118" y="270" >open around x</text><text x="288" y="270" >open around F</text></g>
</svg>