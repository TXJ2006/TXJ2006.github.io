<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 480 260" role="img" aria-labelledby="title desc">
<title id="title">有限积中的小长方体</title><desc id="desc">透视长方体表示积空间，若干小长方体片覆盖其边面，示意有限积紧性的管状邻域证明。</desc>
<defs><pattern id="fineHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V6" stroke="#d0d0d0" stroke-width="1"/></pattern><pattern id="wideHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><path d="M0 0V7" stroke="#8b8b8b" stroke-width="1.2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#171717"/></marker></defs>
<rect width="480" height="300" fill="#fff"/><g fill="#171717" font-family="Georgia, 'Times New Roman', serif" font-size="17" stroke-linecap="round" stroke-linejoin="round"><path d="M114 105L184 60L382 60L312 105Z" fill="url(#fineHatch)" stroke="#171717" stroke-width="1.5"/><path d="M312 105L382 60L382 188L312 233Z" fill="#eee" stroke="#171717" stroke-width="1.5"/><path d="M114 105H312V233H114Z" fill="#fff" stroke="#171717" stroke-width="1.5"/><path d="M114 233L184 188L382 188" fill="none" stroke="#555" stroke-dasharray="5 4"/><path d="M149 105V233 M199 105V233 M249 105V233 M114 150H312 M114 192H312 M350 60V188" fill="none" stroke="#777" stroke-width="1"/><path d="M199 105V150H249V105 M249 150V192H312" fill="url(#wideHatch)" stroke="#171717" stroke-width="1.5"/><text x="181" y="92" >X × Y</text><text x="75" y="260" >finite slices along X</text><text x="320" y="256" >Y</text></g>
