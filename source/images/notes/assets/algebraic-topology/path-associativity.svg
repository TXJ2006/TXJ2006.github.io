<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" role="img" aria-labelledby="title desc"><title id="title">Associativity changes time allocation</title><desc id="desc">The first bar allots a quarter to f, a quarter to g, and half to h. The second allots half to f, a quarter to g, and a quarter to h.</desc><defs><style>text{font-family:Georgia,"Times New Roman",serif;fill:#20313a;font-size:26px}.title{font-size:28px;font-weight:600}.small{font-size:23px;fill:#60716f}.math{font-style:italic}.line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.axis{stroke:#91a39f;stroke-width:2;fill:none}.tick{stroke:#91a39f;stroke-width:2}.dot{fill:#20313a}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197b7c"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b44c50"/></marker></defs><rect width="960" height="415" fill="#f7f9f6"/><text x="40" y="52" class="title">Same order: f, then g, then h</text><text x="60" y="110" class="math">a = (f ∗ g) ∗ h</text><rect x="100" y="133" width="190.0" height="56" fill="#dcefed" stroke="#fff" stroke-width="2"/><text x="195.0" y="170" class="math" text-anchor="middle" style="fill:#197b7c">f</text><rect x="290.0" y="133" width="190.0" height="56" fill="#f3e2df" stroke="#fff" stroke-width="2"/><text x="385.0" y="170" class="math" text-anchor="middle" style="fill:#b44c50">g</text><rect x="480.0" y="133" width="380.0" height="56" fill="#efe9d9" stroke="#fff" stroke-width="2"/><text x="670.0" y="170" class="math" text-anchor="middle" style="fill:#aa7b29">h</text><path d="M100 189 V 199" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="227" text-anchor="middle">0</text><path d="M290.0 189 V 199" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="290.0" y="227" text-anchor="middle">1/4</text><path d="M480.0 189 V 199" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="480.0" y="227" text-anchor="middle">1/2</text><path d="M860 189 V 199" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="860" y="227" text-anchor="middle">1</text><text x="60" y="270" class="math">b = f ∗ (g ∗ h)</text><rect x="100" y="293" width="380.0" height="56" fill="#dcefed" stroke="#fff" stroke-width="2"/><text x="290.0" y="330" class="math" text-anchor="middle" style="fill:#197b7c">f</text><rect x="480.0" y="293" width="190.0" height="56" fill="#f3e2df" stroke="#fff" stroke-width="2"/><text x="575.0" y="330" class="math" text-anchor="middle" style="fill:#b44c50">g</text><rect x="670.0" y="293" width="190.0" height="56" fill="#efe9d9" stroke="#fff" stroke-width="2"/><text x="765.0" y="330" class="math" text-anchor="middle" style="fill:#aa7b29">h</text><path d="M100 349 V 359" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="387" text-anchor="middle">0</text><path d="M480.0 349 V 359" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="480.0" y="387" text-anchor="middle">1/2</text><path d="M670.0 349 V 359" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="670.0" y="387" text-anchor="middle">3/4</text><path d="M860 349 V 359" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="860" y="387" text-anchor="middle">1</text></svg>
