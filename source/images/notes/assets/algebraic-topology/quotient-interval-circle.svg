<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Quotient of an interval to a circle</title>
  <desc id="desc">The endpoints of an interval are identified, producing a circle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#344054"/>
    </marker>
    <style>
      .title{font:600 24px Georgia,"Times New Roman",serif;fill:#20313a}
      .label{font:20px Georgia,"Times New Roman",serif;fill:#334e59}
      .math{font:italic 25px Georgia,"Times New Roman",serif;fill:#20313a}
      .line{stroke:#197b7c;stroke-width:7;stroke-linecap:round}
      .circle{fill:none;stroke:#197b7c;stroke-width:7}
    </style>
  </defs>
  <rect width="960" height="330" fill="#f7faf9"/>
  <text x="230" y="45" class="title" text-anchor="middle">interval before identification</text>
  <text x="735" y="45" class="title" text-anchor="middle">quotient space</text>
  <line x1="85" y1="160" x2="375" y2="160" class="line"/>
  <circle cx="85" cy="160" r="11" fill="#b44c50"/>
  <circle cx="375" cy="160" r="11" fill="#b44c50"/>
  <text x="85" y="205" class="math" text-anchor="middle">0</text>
  <text x="375" y="205" class="math" text-anchor="middle">1</text>
  <text x="230" y="250" class="label" text-anchor="middle">0 ∼ 1</text>
  <path d="M430 160 H560" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="495" y="132" class="math" text-anchor="middle">q</text>
  <circle cx="735" cy="160" r="83" class="circle"/>
  <circle cx="735" cy="77" r="11" fill="#b44c50"/>
  <text x="735" y="285" class="label" text-anchor="middle">[0]=[1], so I/(0 ∼ 1) ≅ S¹</text>
</svg>
