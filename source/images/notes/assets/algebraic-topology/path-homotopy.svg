<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" role="img" aria-labelledby="title desc"><title id="title">A path homotopy: domain versus image</title><desc id="desc">Left: horizontal slices of the parameter square. Bottom is f, top is g; the two vertical edges map to p and q. Right: three image paths share the same endpoints.</desc><defs><style>text{font-family:Georgia,"Times New Roman",serif;fill:#20313a;font-size:26px}.title{font-size:28px;font-weight:600}.small{font-size:23px;fill:#60716f}.math{font-style:italic}.line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.axis{stroke:#91a39f;stroke-width:2;fill:none}.tick{stroke:#91a39f;stroke-width:2}.dot{fill:#20313a}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197b7c"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b44c50"/></marker></defs><rect width="960" height="455" fill="#f7f9f6"/><rect x="20" y="20" width="440" height="415" rx="10" fill="#fff" stroke="#d8e2de"/><rect x="530" y="20" width="410" height="415" rx="10" fill="#fff" stroke="#d8e2de"/><text x="44" y="66" class="title">Parameter square I × I</text><text x="555" y="66" class="title">Images in the space X</text><rect x="118" y="130" width="230" height="230" fill="#f8faf9" stroke="#d8e2de" stroke-width="2"/><path d="M 118 360 H 348" fill="none" stroke="#197b7c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 118 245 H 348" fill="none" stroke="#aa7b29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 118 130 H 348" fill="none" stroke="#b44c50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 118 130 V 360" fill="none" stroke="#b44c50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 348 130 V 360" fill="none" stroke="#b44c50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="232" y="396" class="small" text-anchor="middle">s: 0 → 1</text><text x="44" y="250" class="small">t ↑</text><text x="234" y="118" class="small" text-anchor="middle">g: t = 1</text><text x="234" y="343" class="small" text-anchor="middle">f: t = 0</text><text x="98" y="100" class="math">p</text><text x="353" y="100" class="math">q</text><path d="M 477 245 H 512" fill="none" stroke="#197b7c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="495" y="225" class="math" text-anchor="middle">H</text><path d="M 570 320 L 900 320" fill="none" stroke="#197b7c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 570 320 Q 735 200 900 320" fill="none" stroke="#aa7b29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 570 320 Q 735 80 900 320" fill="none" stroke="#b44c50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="570" cy="320" r="6" class="dot"/><circle cx="900" cy="320" r="6" class="dot"/><text x="560" y="357" class="math">p</text><text x="900" y="357" class="math">q</text><text x="735" y="180" class="math" text-anchor="middle" style="fill:#b44c50">g</text><text x="735" y="251" class="math" text-anchor="middle" style="fill:#aa7b29">H₁/₂</text><text x="735" y="350" class="math" text-anchor="middle" style="fill:#197b7c">f</text><text x="735" y="405" class="small" text-anchor="middle">All three share both endpoints.</text></svg>
