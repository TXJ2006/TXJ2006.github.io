<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 398" role="img" aria-labelledby="title desc"><title id="title">Shrinking the outward and return journey</title><desc id="desc">Three exact parameter graphs at deformation times zero, one half, and one, with maximum heights one, one half, and zero. Composing each with f gives the contracting loop.</desc><defs><style>text{font-family:Georgia,"Times New Roman",serif;fill:#20313a;font-size:26px}.title{font-size:28px;font-weight:600}.small{font-size:23px;fill:#60716f}.math{font-style:italic}.line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.axis{stroke:#91a39f;stroke-width:2;fill:none}.tick{stroke:#91a39f;stroke-width:2}.dot{fill:#20313a}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197b7c"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b44c50"/></marker></defs><rect width="960" height="398" fill="#f7f9f6"/><text x="40" y="48" class="title">Input to f: (1 − t)v(s)</text><text x="175" y="104" text-anchor="middle">t = 0</text><path d="M70 140 V 290 H290" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M70 290 L175 140 L280 290" fill="none" stroke="#197b7c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="57" y="298" class="small" text-anchor="end">0</text><text x="57" y="148" class="small" text-anchor="end">1</text><text x="280" y="326" class="small" text-anchor="middle">1</text><text x="175" y="326" class="small" text-anchor="middle">1/2</text><text x="294" y="302" class="math">s</text><text x="175" y="369" class="small" text-anchor="middle">out and back</text><text x="490" y="104" text-anchor="middle">t = 1/2</text><path d="M385 140 V 290 H605" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M385 290 L490 215 L595 290" fill="none" stroke="#aa7b29" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="372" y="298" class="small" text-anchor="end">0</text><text x="372" y="148" class="small" text-anchor="end">1</text><text x="595" y="326" class="small" text-anchor="middle">1</text><text x="490" y="326" class="small" text-anchor="middle">1/2</text><text x="609" y="302" class="math">s</text><text x="490" y="369" class="small" text-anchor="middle">half the parameter range</text><text x="805" y="104" text-anchor="middle">t = 1</text><path d="M700 140 V 290 H920" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M700 290 L805 290 L910 290" fill="none" stroke="#b44c50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="687" y="298" class="small" text-anchor="end">0</text><text x="687" y="148" class="small" text-anchor="end">1</text><text x="910" y="326" class="small" text-anchor="middle">1</text><text x="805" y="326" class="small" text-anchor="middle">1/2</text><text x="924" y="302" class="math">s</text><text x="805" y="369" class="small" text-anchor="middle">constant at f(0)</text></svg>
