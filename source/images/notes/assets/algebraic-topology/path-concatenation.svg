<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">Concatenating two paths</title><desc id="desc">An upper schematic of paths from p to q to r. Below, an exact parameter bar gives each path half the interval, irrespective of geometric lengths.</desc><defs><style>text{font-family:Georgia,"Times New Roman",serif;fill:#20313a;font-size:26px}.title{font-size:28px;font-weight:600}.small{font-size:23px;fill:#60716f}.math{font-style:italic}.line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.axis{stroke:#91a39f;stroke-width:2;fill:none}.tick{stroke:#91a39f;stroke-width:2}.dot{fill:#20313a}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197b7c"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b44c50"/></marker></defs><rect width="960" height="420" fill="#f7f9f6"/><text x="40" y="52" class="title">In X: first follow f, then follow g</text><path d="M 100 170 C 190 80, 270 205, 460 145" fill="none" stroke="#197b7c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 460 145 C 620 55, 690 220, 860 140" fill="none" stroke="#b44c50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 229.532 143.348 L 233.536 144.230 L 237.583 145.136 L 241.676 146.063 L 245.815 147.004 L 250.002 147.956 L 254.239 148.913 L 258.526 149.871 L 262.866 150.826" fill="none" stroke="#197b7c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 642.162 134.006 L 646.564 135.472 L 650.965 136.955 L 655.369 138.450 L 659.777 139.951 L 664.191 141.452 L 668.614 142.947 L 673.048 144.430 L 677.495 145.896" fill="none" stroke="#b44c50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-rust)"/><circle cx="100" cy="170" r="6" class="dot"/><text x="100" y="210" class="math" text-anchor="middle">p</text><circle cx="460" cy="145" r="6" class="dot"/><text x="460" y="185" class="math" text-anchor="middle">q</text><circle cx="860" cy="140" r="6" class="dot"/><text x="860" y="180" class="math" text-anchor="middle">r</text><text x="270" y="120" class="math" text-anchor="middle" style="fill:#197b7c">f</text><text x="675" y="110" class="math" text-anchor="middle" style="fill:#b44c50">g</text><text x="40" y="261" class="title">In I: the two halves of the parameter interval</text><rect x="100" y="290" width="380" height="64" fill="#dcefed"/><rect x="480" y="290" width="380" height="64" fill="#f3e2df"/><text x="290" y="331" class="math" text-anchor="middle" style="fill:#197b7c">f(2s)</text><text x="670" y="331" class="math" text-anchor="middle" style="fill:#b44c50">g(2s − 1)</text><path d="M100 354 V 365" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="396" text-anchor="middle">0</text><path d="M480 354 V 365" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="480" y="396" text-anchor="middle">1/2</text><path d="M860 354 V 365" fill="none" stroke="#60716f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="860" y="396" text-anchor="middle">1</text></svg>
