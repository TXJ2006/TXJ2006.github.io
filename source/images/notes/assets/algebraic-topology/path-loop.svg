<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="title desc"><title id="title">Paths and based loops</title><desc id="desc">Two schematic paths in a space: a path with distinct endpoints p and q, and a genuinely closed loop at x zero. Arrows indicate increasing s.</desc><defs><style>text{font-family:Georgia,"Times New Roman",serif;fill:#20313a;font-size:26px}.title{font-size:28px;font-weight:600}.small{font-size:23px;fill:#60716f}.math{font-style:italic}.line{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.axis{stroke:#91a39f;stroke-width:2;fill:none}.tick{stroke:#91a39f;stroke-width:2}.dot{fill:#20313a}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#197b7c"/></marker><marker id="arrow-rust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b44c50"/></marker></defs><rect width="960" height="380" fill="#f7f9f6"/><rect x="20" y="20" width="445" height="340" rx="10" fill="#fff" stroke="#d8e2de"/><rect x="485" y="20" width="455" height="340" rx="10" fill="#fff" stroke="#d8e2de"/><text x="45" y="65" class="title">A path from p to q</text><text x="510" y="65" class="title">A loop based at x₀</text><text x="45" y="103" class="small">f(0) = p,  f(1) = q</text><text x="510" y="103" class="small">f(0) = f(1) = x₀</text><path d="M 75 275 C 130 115, 260 320, 405 155" fill="none" stroke="#197b7c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 192.670 214.360 L 196.866 215.131 L 201.106 215.920 L 205.388 216.716 L 209.713 217.511 L 214.080 218.297 L 218.488 219.066 L 222.936 219.807 L 227.423 220.514" fill="none" stroke="#197b7c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="75" cy="275" r="6" class="dot"/><circle cx="405" cy="155" r="6" class="dot"/><text x="65" y="315" class="math">p</text><text x="415" y="147" class="math">q</text><path d="M 605 260 C 550 160, 650 115, 742 142 C 855 172, 847 293, 735 302 C 677 307, 636 292, 605 260 Z" fill="none" stroke="#197b7c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 822.003 215.038 L 822.437 217.957 L 822.742 220.877 L 822.919 223.795 L 822.968 226.707 L 822.889 229.612 L 822.682 232.504 L 822.347 235.382 L 821.886 238.242" fill="none" stroke="#197b7c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="605" cy="260" r="6" class="dot"/><text x="565" y="296" class="math">x₀</text></svg>
