<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
  <title id="title">八字形的三重非正规覆盖</title>
  <desc id="desc">覆盖图三个顶点 1、2、3。蓝色 a 边按 1 到 2 到 3 到 1 组成有向三角形；红色 b 边分别从 1 到 2、2 到 1，并在 3 处形成环。右侧为底空间八字形。</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#166a82"/></marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b44c50"/></marker>
    <marker id="gray-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#344054"/></marker>
    <style>
      .title{font:600 25px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#18212a}
      .label{font:20px system-ui,-apple-system,"PingFang SC",sans-serif;fill:#475467}
      .math{font:italic 25px Georgia,serif;fill:#18212a}
      .a{fill:none;stroke:#166a82;stroke-width:4;marker-end:url(#blue-arrow)}
      .b{fill:none;stroke:#b44c50;stroke-width:4;marker-end:url(#red-arrow)}
    </style>
  </defs>
  <rect width="1120" height="510" fill="#f7f9fa"/>
  <text x="350" y="50" class="title" text-anchor="middle">三重覆盖图</text>
  <text x="935" y="50" class="title" text-anchor="middle">底空间：八字形</text>
  <path d="M368 139 L474 358" class="a"/>
  <path d="M449 384 L202 384" class="a"/>
  <path d="M177 358 L283 139" class="a"/>
  <path d="M389 115 C571 155 589 281 507 364" class="b"/>
  <path d="M514 374 C665 216 558 89 392 102" class="b"/>
  <path d="M145 379 C20 296 25 474 145 391" class="b"/>
  <circle cx="325" cy="115" r="24" fill="#fff" stroke="#344054" stroke-width="3"/>
  <circle cx="490" cy="382" r="24" fill="#fff" stroke="#344054" stroke-width="3"/>
  <circle cx="160" cy="382" r="24" fill="#fff" stroke="#344054" stroke-width="3"/>
  <text x="325" y="123" class="math" text-anchor="middle">1</text>
  <text x="490" y="390" class="math" text-anchor="middle">2</text>
  <text x="160" y="390" class="math" text-anchor="middle">3</text>
  <text x="382" y="251" class="math">a</text>
  <text x="316" y="375" class="math">a</text>
  <text x="220" y="251" class="math">a</text>
  <text x="545" y="184" class="math">b</text>
  <text x="604" y="297" class="math">b</text>
  <text x="37" y="332" class="math">b</text>
  <path d="M662 275 H761" fill="none" stroke="#344054" stroke-width="3" marker-end="url(#gray-arrow)"/>
  <text x="710" y="250" class="math" text-anchor="middle">p</text>
  <path d="M885 272 C768 130 765 412 885 282" class="a"/>
  <path d="M932 272 C1050 130 1053 412 932 282" class="b"/>
  <circle cx="908" cy="277" r="25" fill="#fff" stroke="#344054" stroke-width="3"/>
  <text x="908" y="285" class="math" text-anchor="middle">x₀</text>
  <text x="777" y="169" class="math">a</text>
  <text x="1048" y="169" class="math">b</text>
  <text x="355" y="480" class="label" text-anchor="middle">a: 1 → 2 → 3 → 1　　b: 1 ↔ 2, 3 → 3</text>
</svg>
