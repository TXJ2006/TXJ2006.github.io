<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">商映射的泛性质</title>
  <desc id="desc">映射 f 在每个等价类上取同一个值，因此先通过商映射 q 到达商集，再由唯一映射 f bar 到达 Y。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#30343b"/>
    </marker>
    <style>
      .label { font: 600 25px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #20242a; }
      .small { font: 500 20px system-ui, -apple-system, "PingFang SC", sans-serif; fill: #444b55; }
      .math { font: italic 25px Georgia, "Times New Roman", serif; fill: #20242a; }
      .edge { fill: none; stroke: #30343b; stroke-width: 3; marker-end: url(#arrow); }
      .point { fill: #ffffff; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#f7f8fa"/>

  <text x="125" y="62" class="math" text-anchor="middle">X</text>
  <rect x="28" y="88" width="194" height="372" rx="4" fill="#ffffff" stroke="#30343b" stroke-width="2"/>
  <ellipse cx="125" cy="178" rx="66" ry="58" fill="#dceee8" stroke="#177d68" stroke-width="2"/>
  <ellipse cx="125" cy="366" rx="66" ry="58" fill="#f5dfe2" stroke="#b54455" stroke-width="2"/>
  <circle cx="96" cy="160" r="8" class="point" stroke="#177d68"/>
  <circle cx="142" cy="142" r="8" class="point" stroke="#177d68"/>
  <circle cx="151" cy="194" r="8" class="point" stroke="#177d68"/>
  <circle cx="94" cy="350" r="8" class="point" stroke="#b54455"/>
  <circle cx="143" cy="337" r="8" class="point" stroke="#b54455"/>
  <circle cx="136" cy="390" r="8" class="point" stroke="#b54455"/>
  <text x="125" y="490" class="small" text-anchor="middle">同色区域表示等价类</text>

  <text x="554" y="62" class="math" text-anchor="middle">X / ~</text>
  <rect x="440" y="88" width="228" height="372" rx="4" fill="#ffffff" stroke="#30343b" stroke-width="2"/>
  <rect x="486" y="142" width="136" height="72" rx="4" fill="#dceee8" stroke="#177d68" stroke-width="2"/>
  <rect x="486" y="330" width="136" height="72" rx="4" fill="#f5dfe2" stroke="#b54455" stroke-width="2"/>
  <text x="554" y="187" class="math" text-anchor="middle">[x₁]</text>
  <text x="554" y="375" class="math" text-anchor="middle">[x₂]</text>
  <text x="554" y="490" class="small" text-anchor="middle">每个等价类成为一个点</text>

  <text x="1046" y="62" class="math" text-anchor="middle">Y</text>
  <rect x="949" y="88" width="194" height="372" rx="4" fill="#ffffff" stroke="#30343b" stroke-width="2"/>
  <circle cx="1046" cy="178" r="17" fill="#dceee8" stroke="#177d68" stroke-width="3"/>
  <circle cx="1046" cy="366" r="17" fill="#f5dfe2" stroke="#b54455" stroke-width="3"/>
  <text x="1046" y="490" class="small" text-anchor="middle">类内各点具有相同像</text>

  <path d="M232 274 L423 274" class="edge"/>
  <text x="326" y="249" class="math" text-anchor="middle">q</text>

  <path d="M678 274 L931 274" class="edge"/>
  <text x="804" y="249" class="math" text-anchor="middle">f̄</text>

  <path d="M214 112 C510 -24, 832 -10, 974 118" class="edge"/>
  <text x="602" y="32" class="math" text-anchor="middle">f = f̄ ∘ q</text>
</svg>
