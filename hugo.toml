theme = 'PaperMod'

[params]
    math = true
    defaultTheme = "light"
    ShowToc = true
    TocOpen = false
    ShowBreadCrumbs = true
    ShowPostNavLinks = false
    ShowCodeCopyButtons = true
    ShowReadingTime = true
    ShowShareButtons = false
