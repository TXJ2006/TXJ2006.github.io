    [params.label]
        text = "Xujiang Tang"

    [params.homeInfoParams]
        Title = "Xujiang Tang (唐旭江)"
        Content = """
I am a **theoretical mathematics researcher** and **machine learning theory researcher**, with my work centered on mathematics. I am currently an undergraduate student in Mathematics and Applied Mathematics at **Yangtze University** and a visiting student at **Great Bay University**.\n\n
My mathematical interests include finite group theory, algebraic topology, equivariant homotopy theory, formal proof, optimization, stochastic processes, and the mathematical foundations of machine learning. My current submitted manuscripts include work on **Quillen's p-subgroup conjecture** and **geometric fixed point tomography / Bökstedt periodicity**.\n\n
**Research interests:** theoretical mathematics · algebraic topology · finite group theory · formal proof · machine learning theory · learning theory · optimization · stochastic processes\n\n
[Research](/research/) · [Publications](/publications/) · [Curriculum Vitae](/cv/) · [Email](mailto:txj_262538@163.com)
"""

