baseURL = 'https://txj2006.github.io/'
languageCode = 'en-us'
title = 'Xujiang Tang'
theme = 'PaperMod'
disableKinds = ['taxonomy', 'term']

[params]
    math = true
    defaultTheme = "light"
    disableThemeToggle = true
    ShowToc = false
    TocOpen = false
    ShowBreadCrumbs = true
    ShowPostNavLinks = false
    ShowCodeCopyButtons = true
    ShowReadingTime = false
    ShowShareButtons = false
    ShowWordCount = false
    comments = false
    author = "Xujiang Tang"
    description = "Xujiang Tang (唐煦江) researches algebraic topology, efficient AI reasoning, bandit algorithms, reinforcement learning, machine-learning theory, algorithm design, and formalized mathematics."
    [params.label]
        text = "Xujiang Tang"

    [[params.socialIcons]]
        name = "github"
        title = "GitHub"
        url = "https://github.com/TXJ2006"
    [[params.socialIcons]]
        name = "linkedin"
        title = "LinkedIn"
        url = "https://www.linkedin.com/in/%E7%85%A6%E6%B1%9F-%E5%94%90-7a1513392"
    [[params.socialIcons]]
        name = "orcid"
        title = "ORCID"
        url = "https://orcid.org/0009-0008-1127-6420"
    [[params.socialIcons]]
        name = "email"
        title = "Email"
        url = "mailto:txj_262538@163.com"

[[menu.main]]
    name = "About"
    url = "/about/"
    weight = 1

[[menu.main]]
    name = "Research"
    url = "/research/"
    weight = 2

[[menu.main]]
    name = "Publications"
    url = "/publications/"
    weight = 3

[[menu.main]]
    name = "Notes"
    url = "/notes/"
    weight = 4

[[menu.main]]
    name = "CV"
    url = "/cv/"
    weight = 5

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
        [markup.goldmark.extensions]
            [markup.goldmark.extensions.passthrough]
                enable = true
                [markup.goldmark.extensions.passthrough.delimiters]
                    block = [['$$', '$$'], ['\[', '\]']]
                    inline = [['$', '$'], ['\(', '\)']]

[minify]
    [minify.tdewolff]
        [minify.tdewolff.html]
            keepQuotes = true
            keepEndTags = true
