    comments = false
    author = "Xujiang Tang"
    description = "Xujiang Tang (唐旭江) — undergraduate student in mathematics, working on statistical learning theory, optimization, stochastic processes, and mathematical machine learning."

    [params.label]
        text = "Xujiang Tang"

    [params.homeInfoParams]
        Title = "Xujiang Tang (唐旭江)"
        Content = """
I am an undergraduate student in **Mathematics and Applied Mathematics** at **Yangtze University**, and a visiting student at **Johns Hopkins University**. My current research interests lie in **statistical learning theory**, **optimization**, **stochastic processes**, and **mathematical foundations of machine learning**.\n\n
My recent work studies out-of-distribution generalization, learnability, Koopman/operator-theoretic methods for dynamical systems, and stochastic models in quantitative finance.\n\n
**Research interests:** learning theory · optimization · stochastic processes · dynamical systems · causal inference · quantitative finance\n\n
[About](/about/) · [Research](/research/) · [Publications](/publications/) · [CV](/cv/)
"""

