    author = "Xujiang Tang"
    description = "Xujiang Tang (唐煦江) — theoretical mathematics researcher and machine learning theory enthusiast. Research interests include algebraic topology, finite group theory, equivariant homotopy theory, formal proof, and mathematically grounded learning theory."

    [params.label]
        text = "Xujiang Tang"

    [params.homeInfoParams]
        Title = "Xujiang Tang (唐煦江)"
        Content = """
I am a **theoretical mathematics researcher** and a **machine learning theory enthusiast**. My work is centered on theoretical mathematics. I am currently an undergraduate student in **Mathematics and Applied Mathematics** at **Yangtze University College of Arts and Sciences** and a visiting student at **Great Bay University**.\n\n
My main research interests are **algebraic topology**, **finite group theory**, **equivariant homotopy theory**, and **formal proof**. I also study machine learning theory from a mathematical perspective, especially **generalization**, **out-of-distribution prediction**, and **Koopman/operator-theoretic methods** for long-sequence data.\n\n
[About](/about/) · [Research](/research/) · [Notes](/notes/) · [Publications](/publications/) · [Curriculum Vitae](/cv/) · [Email](mailto:txj_262538@163.com)
"""

