    [params.label]
        text = "Xujiang Tang"

    [params.homeInfoParams]
        Title = "Xujiang Tang (唐旭江)"
        Content = """
I study mathematical problems in **learning theory**, **optimization**, **stochastic processes**, and the **mathematical foundations of machine learning**. I am currently an undergraduate student in Mathematics and Applied Mathematics at **Yangtze University** and a visiting student at **Johns Hopkins University**.\n\n
My present work focuses on out-of-distribution generalization, learnability, operator-theoretic methods for dynamical systems, and stochastic models motivated by quantitative finance.\n\n
**Research interests:** statistical learning theory · generalization · optimization · stochastic processes · dynamical systems · causal inference · quantitative finance\n\n
[Research](/research/) · [Publications](/publications/) · [Curriculum Vitae](/cv/) · [Email](mailto:txj_262538@163.com)
"""

